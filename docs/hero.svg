<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ZIMZILLA">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rainfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dffb0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dffb0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff41" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="420" rx="10"/></clipPath>
  </defs>

  <style>
    .rain { font: 16px ui-monospace, Menlo, Consolas, monospace;
             fill: url(#rainfade); animation: fall linear infinite; }
    @keyframes fall { from { transform: translateY(0); } to { transform: translateY(690px); } }

    /* Base state is fully visible; the loop only dips it briefly. */
    .gl rect { fill: #00ff41;
                animation: flicker 7s steps(1,end) infinite; }
    @keyframes flicker {
      0%, 88%   { opacity: 1; }
      89%       { opacity: 0.62; }
      90%       { opacity: 1; }
      91%       { opacity: 0.38; }
      92%, 100% { opacity: 1; }
    }

    .halo { animation: halo 3.6s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

    .band { animation: band 3.8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes band { 0% { transform: translateX(-1280px); }
                       55%,100% { transform: translateX(1280px); } }

    .sweep { animation: sweep 5.4s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-90px); } 100% { transform: translateY(510px); } }

    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .tag, .meta { paint-order: stroke; stroke: #040704; stroke-width: 5;
                   stroke-linejoin: round; }
    .tag { font: 600 15px ui-monospace, Menlo, Consolas, monospace;
            letter-spacing: 3.2px; fill: #7dffb0; }
    .meta { font: 13px ui-monospace, Menlo, Consolas, monospace;
             letter-spacing: 1.6px; fill: #0c5a22; }

    @media (prefers-reduced-motion: reduce) {
      .rain, .gl rect, .band, .sweep, .cur, .halo { animation: none; }
    }
  </style>

