[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zimzilla"
version = "1.0.0"
description = "An agentic coding CLI over the Anthropic Messages API with a green-on-black hacker TUI."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "textual>=0.80",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
zimzilla = "zimzilla.__main__:main"

[tool.setuptools.packages.find]
include = ["zimzilla*"]
