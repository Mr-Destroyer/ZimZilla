general_settings:
  # Required since litellm 1.104 — see the note in packaging/logfare's config.
  # Without a master key the proxy refuses to start rather than accept every
  # request unauthenticated. The harness's own upstream token is the proxy
  # credential, so requests it already sends keep working.
  master_key: os.environ/ANTHROPIC_AUTH_TOKEN

model_list:
  # Token Juice's whole catalog is one chat model, exposed upstream as
  # `deepseek-ai/DeepSeek-V4.1-Flash-1017`. The alias below is what ZimZilla
  # (and anything else speaking Anthropic's protocol) asks for.
  #
  # The upstream name carries a snapshot suffix that Token Juice rotates, and
  # naming a suffix that no longer exists fails as a 404 "Model not found"
  # rather than a helpful error. If this breaks again, re-read the live
  # catalog before touching anything else:
  #   curl -s https://api.tokenjuice.ai/v1/models -H "Authorization: Bearer $ANTHROPIC_AUTH_TOKEN"
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4.1-Flash-1017
      api_base: https://api.tokenjuice.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN
