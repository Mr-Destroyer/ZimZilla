# The Logfare catalog, refreshed against upstream's /v1/models and verified
# model-by-model with a chat/completions probe. Only models that answer 200 are
# registered here; the image/TTS/STT models the catalog also lists
# (flux-*, sdxl-lightning, whisper-large-v3-turbo, aura-2-en, nova-3,
# phoenix-1.0, lucid-origin) do not support chat and are deliberately omitted.
#
# Every entry below is a `model_name` the proxy will accept. The upstream name
# is the same string, prefixed with `openai/` for LiteLLM's OpenAI-compatible
# route. Add a model here *and* to zimzilla/config.py + zimzilla/sources.py to
# make it selectable from /model.
general_settings:
  # Required since litellm 1.104: without a master key the proxy refuses to
  # start, because it would otherwise accept every request with no
  # authentication. This proxy is a local translation shim in front of Logfare,
  # not a multi-tenant gateway, so the harness's own upstream token doubles as
  # the proxy credential — ZimZilla already sends it as x-api-key, so the
  # request that worked before keeps working, while anything else on the box
  # that finds the port is now rejected.
  master_key: os.environ/ANTHROPIC_AUTH_TOKEN

model_list:
  # --- Claude ----------------------------------------------------------------
  # deepseek-v4.1-flash is the shipped default (DEFAULT_MODEL / MODEL_DEFAULT).
  - model_name: claude-opus-4.6
    litellm_params:
      model: openai/claude-opus-4.6
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: openai/claude-sonnet-4.6
      api_base: https://logfare.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN

  # --- DeepSeek / GLM / Grok -------------------------------------------------
